version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${AIRFLOW_DB:-airflow}
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwL61YBQPI8=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    - _AIRFLOW_WWW_USER_USERNAME=${_AIRFLOW_WWW_USER_USERNAME:-airflow}
    - _AIRFLOW_WWW_USER_PASSWORD=${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    - PATH=/home/airflow/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - KAFKA_BROKER=kafka:9092
    - KAFKA_TOPIC=orders.events
    - DBT_TARGET=postgres
    - DBT_HOST=postgres
    - DBT_PORT=5432
    - DBT_USER=${POSTGRES_USER:-postgres}
    - DBT_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    - DBT_DATABASE=${WAREHOUSE_DB:-warehouse}
    - DBT_PROJECT_DIR=/opt/airflow/dbt_project
    - DBT_PROFILES_DIR=/opt/airflow/dbt_project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
    - ./consumer:/opt/airflow/consumer
    - ./producer:/opt/airflow/producer
    - ./scripts:/opt/airflow/scripts
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  # ==========================================
  # 1. PostgreSQL (Warehouse + Airflow Metadata)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: streamquery-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sh:/docker-entrypoint-initdb.d/init_databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. Confluent Kafka (KRaft Mode - No Zookeeper)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamquery-kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # ==========================================
  # 3. Topic Initialization Helper
  # ==========================================
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamquery-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      kafka-topics --bootstrap-server kafka:9092 --list
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.events --replication-factor 1 --partitions 3
      echo 'Available topics:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "

  # ==========================================
  # 4. Airflow Initialization
  # ==========================================
  airflow-init:
    <<: *airflow-common
    container_name: streamquery-airflow-init
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --firstname Data \
          --lastname Engineer \
          --role Admin \
          --email admin@streamquery.local \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" || true

  # ==========================================
  # 5. Airflow Webserver
  # ==========================================
  airflow-webserver:
    <<: *airflow-common
    container_name: streamquery-airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ==========================================
  # 6. Airflow Scheduler
  # ==========================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: streamquery-airflow-scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ==========================================
  # 7. Natural Language Query Agent API
  # ==========================================
  agent-api:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: streamquery-agent-api
    ports:
      - "8000:8000"
    environment:
      - DBT_HOST=postgres
      - DBT_PORT=5432
      - DBT_USER=${POSTGRES_USER:-postgres}
      - DBT_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DBT_DATABASE=${WAREHOUSE_DB:-warehouse}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  airflow-logs:
